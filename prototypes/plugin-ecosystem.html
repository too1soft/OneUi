<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneUI 开发者中心交互原型</title>
<style>
:root{--bg:#fafbf9;--surface:#fff;--ink:#1c2b23;--muted:#52655a;--line:#d5ded7;--soft:#edf3ed;--accent:#28613d;--on:#fff;color-scheme:light}.dark{--bg:#101715;--surface:#17211c;--ink:#e6eee8;--muted:#a7b9ad;--line:#3b5144;--soft:#22332a;--accent:#c4ed87;--on:#16230f;color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:15px/1.7 "Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit;color:inherit}button,a{cursor:pointer}button{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:10px 16px}button:hover,a:hover{color:var(--accent)}button:disabled{opacity:.6;cursor:wait}a{color:var(--accent);text-underline-offset:4px}header{border-bottom:1px solid var(--line);padding:18px 5%;display:flex;align-items:center;gap:32px;flex-wrap:wrap}header strong{font-size:24px}nav{display:flex;gap:24px}nav a[aria-current=page]{font-weight:700}header>button{margin-left:auto}.wrap{max-width:1120px;margin:auto;padding:42px 24px}h1{font-size:38px;margin:0 0 12px}h2{font-size:25px;margin:0 0 15px}h3{margin:0}p{margin:10px 0;color:var(--muted)}.note{font-size:13px;background:var(--soft);padding:12px 24px;text-align:center}.split{display:grid;grid-template-columns:1fr 1.2fr;gap:60px;margin:45px 0}.choices{display:grid;gap:12px;margin-top:25px}.choices button{text-align:left}.choices .active,.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}pre{background:#16271e;color:#e5eee6;padding:22px;border-radius:10px;overflow:auto;font-size:13px}code{font-family:Consolas,monospace}.filters{display:flex;gap:16px;align-items:end;margin:30px 0}.filters label{flex:1}label{display:grid;gap:6px}input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}article{padding:26px 0;border-top:1px solid var(--line)}article h2{font-size:24px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}details{margin-top:18px}summary{cursor:pointer;color:var(--accent)}.body{max-width:74ch}.links{display:flex;gap:24px;flex-wrap:wrap;margin:30px 0}.empty{padding:44px 0;text-align:center}.status{min-height:28px;color:var(--accent)}dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(550px,92vw);padding:28px}dialog::backdrop{background:#10201888}dialog label{margin-top:18px}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.dialog-head button{padding:6px 14px}.error{color:#a02b24}.dark .error{color:#ffb4a8}.row{display:flex;align-items:center;gap:10px}.row input{width:auto}.busy{animation:busy .8s ease-in-out alternate infinite}@keyframes busy{to{opacity:.5}}:focus-visible{outline:2px solid var(--accent);outline-offset:4px}::selection{background:var(--accent);color:var(--on)}[hidden]{display:none!important}@media(max-width:640px){header{gap:14px;padding:14px 20px}header strong{font-size:21px}nav{gap:17px;order:3;width:100%}.wrap{padding:28px 20px}h1{font-size:30px}.split{grid-template-columns:1fr;gap:25px;margin-top:30px}.filters{flex-wrap:wrap}.filters label:first-child{flex-basis:100%}.filters label{min-width:120px}}@media(prefers-reduced-motion:reduce){.busy{animation:none}}
</style></head><body>
<header><strong>OneUI</strong><nav aria-label="主导航"><a href="#developers">开发者中心</a><a href="#plugins">插件目录</a><a href="#guide">接入指南</a></nav><button id="theme" aria-label="切换主题">切换主题</button></header>
<div class="note">交互原型 · 使用模拟目录与安装结果，所有操作在本页演示。</div>
<main class="wrap" id="main"></main>
<dialog id="install" aria-labelledby="install-title"><div class="dialog-head"><h2 id="install-title">安装演示</h2><button id="close" aria-label="关闭安装演示">关闭</button></div><p id="package-name"></p><form id="install-form"><label>项目名称<input id="project" required pattern="[A-Za-z][A-Za-z0-9_-]{0,39}" value="my_app"></label><label>目标<select id="target"><option value="shared">Windows x64 · 动态链接</option><option value="static">Windows x64 · 静态链接</option><option value="macos-shared" data-macos-target>macOS arm64 · 动态链接</option><option value="macos-static" data-macos-target>macOS arm64 · 静态链接</option><option value="android">Android arm64 · 源码接入</option></select></label><label class="row"><input type="checkbox" id="fail-install">模拟下载失败</label><div class="actions"><button type="submit" class="primary" id="confirm">开始安装</button><button type="button" id="cancel">取消</button></div></form><pre id="terminal" aria-live="polite">等待安装。</pre><div class="actions" id="result-actions" hidden><button id="restore">离线恢复</button><button id="remove">移除依赖</button><a href="#guide" id="read-guide">查看构建接入</a></div></dialog>
<script>
const main=document.querySelector('#main'),dialog=document.querySelector('#install');
const packages=[{id:'oneui.uuid',version:'0.1.1',kind:'service',title:'系统 UUID 生成器',text:'通过系统随机数服务生成标准小写 UUIDv4。',api:'oneui.uuid.generator · ABI 1',deps:'oneui.native-sdk ^0.1.1'},{id:'oneui.vpn',kind:'service',title:'VPN 会话服务',text:'通过版本化服务表接入原生 VPN 宿主。',api:'oneui.vpn.sessions · ABI 1',deps:'oneui.native-sdk ^0.1.0'},{id:'oneui.status',kind:'component',title:'原生状态组件',text:'带进度显示、键盘激活与无障碍信息的组件。',api:'OneUI_Status · 契约 1',deps:'OneUI SDK ABI 46'},{id:'oneui.native-sdk',version:'0.1.1',kind:'sdk',title:'原生 SDK',text:'独立于渲染器的 Plugin 与 VPN SDK。',api:'Plugin ABI 1',deps:'无包级依赖'}];
const examples={app:['构建应用','使用预编译 SDK 编译应用代码。','find_package(OneUI CONFIG REQUIRED)\nadd_executable(app main.cpp)\ntarget_link_libraries(app PRIVATE OneUI::oneui)'],service:['接入系统能力','安装一个服务包，让应用运行时管理服务生命周期。','oneui-site plugin add --id oneui.vpn --version "^0.1.0" --target windows-modern-x86_64 --linkage shared'],component:['扩展界面组件','用同一份契约连接页面编译器与原生控件。','<OneUI_Status :label="label" :value="value" @activate="activate" />']};
const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='app',query='',kind='all',catalogState='ready',selected=packages[0],timer=null,installed=false;
function developer(){main.innerHTML='<h1>开发者中心</h1><p>从一个应用开始，扩展到你需要的能力。</p><section class="split"><div><h2>你准备从哪里开始？</h2><p>OneUI 提供界面底座，插件封装可选能力。</p><div class="choices">'+Object.entries(examples).map(([k,v])=>`<button data-mode="${k}" aria-pressed="${mode===k}" class="${mode===k?'active':''}">${v[0]}</button>`).join('')+'</div></div><div><p>'+examples[mode][1]+'</p><pre><code>'+escape(examples[mode][2])+'</code></pre><button id="show-command">选择代码</button><p class="status" role="status" id="code-status"></p></div></section><section><h2>让通用能力成为独立的包。</h2><div class="links"><a href="#plugins">浏览插件目录</a><a href="#guide">安装与依赖</a><a href="#components">组件开发</a><a href="#platforms">平台装配</a></div></section>';main.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;developer()});main.querySelector('#show-command').onclick=()=>{const range=document.createRange();range.selectNodeContents(main.querySelector('code'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);main.querySelector('#code-status').textContent='代码已选中，可复制到项目。'};}
function catalog(){main.innerHTML='<h1>插件目录</h1><p>按需添加能力，让 OneUI 随应用扩展。</p><div class="actions"><button id="network">'+(catalogState==='error'?'重新加载目录':'模拟目录不可用')+'</button></div><div class="filters"><label>查找插件<input id="query" type="search" placeholder="包名或功能" value="'+escape(query)+'"></label><label>类型<select id="kind"><option value="all">全部类型</option><option value="service">服务插件</option><option value="component">组件包</option><option value="sdk">原生 SDK</option></select></label></div><div id="results"></div>';main.querySelector('#kind').value=kind;main.querySelector('#query').oninput=e=>{query=e.target.value;results()};main.querySelector('#kind').onchange=e=>{kind=e.target.value;results()};main.querySelector('#network').onclick=()=>{catalogState=catalogState==='error'?'loading':'error';catalog();if(catalogState==='loading')setTimeout(()=>{catalogState='ready';if(location.hash==='#plugins')catalog()},400)};results();}
function results(){const box=main.querySelector('#results');if(catalogState==='error'){box.innerHTML='<div class="empty" role="alert"><h2>暂时无法读取插件目录</h2><p>点击“重新加载目录”恢复。</p></div>';return}if(catalogState==='loading'){box.innerHTML='<p class="busy" role="status">正在读取插件目录…</p>';return}const list=packages.filter(p=>(kind==='all'||p.kind===kind)&&(p.id+p.title+p.text).toLowerCase().includes(query.trim().toLowerCase()));box.innerHTML='<p role="status">'+list.length+' 个匹配的包</p>'+list.map(p=>`<article><h2>${p.id}</h2><p>${p.title} · ${p.version||'0.1.0'} · MIT</p><p>${p.text}</p><details><summary>查看接口与依赖</summary><p>${p.api}</p><p>依赖：${p.deps}</p></details><div class="actions"><button data-package="${p.id}" class="primary">安装演示</button><a href="${p.kind==='component'?'#components':'#guide'}">接入文档</a></div></article>`).join('');if(!list.length){box.innerHTML+='<div class="empty"><h2>没有匹配的插件</h2><button id="clear">清除筛选</button></div>';box.querySelector('#clear').onclick=()=>{query='';kind='all';catalog()}}box.querySelectorAll('[data-package]').forEach(b=>b.onclick=()=>openInstall(packages.find(p=>p.id===b.dataset.package)));}
function openInstall(p){selected=p;installed=false;document.querySelector('#package-name').textContent=p.id+' · '+(p.version||'0.1.0');document.querySelector('#terminal').textContent='等待安装。';document.querySelector('#result-actions').hidden=true;document.querySelector('#confirm').disabled=false;document.querySelector('#confirm').textContent='开始安装';dialog.showModal();}
function cancel(){clearTimeout(timer);timer=null;document.querySelector('#confirm').disabled=false;document.querySelector('#terminal').className='';dialog.close();}
document.querySelector('#close').onclick=cancel;document.querySelector('#cancel').onclick=cancel;dialog.addEventListener('cancel',()=>{clearTimeout(timer)});
document.querySelector('#install-form').onsubmit=e=>{e.preventDefault();const button=document.querySelector('#confirm'),out=document.querySelector('#terminal');button.disabled=true;document.querySelector('#result-actions').hidden=true;out.className='busy';out.textContent='解析依赖 → 校验目标 → 下载与完整性校验…';timer=setTimeout(()=>{out.className='';button.disabled=false;if(selected.id==='oneui.uuid' && document.querySelector('#target').value==='android'){out.textContent='UUID 提供 Windows x64 和 macOS arm64 下载，请选择对应桌面目标。';button.textContent='重新选择目标';return}if(document.querySelector('#fail-install').checked){out.textContent='模拟下载失败：连接中断。取消“模拟下载失败”后重试，项目锁未改变。';button.textContent='重试安装';return}installed=true;out.textContent='已安装 '+selected.id+' 到 '+document.querySelector('#project').value+'。\n已写入项目锁与生成 CMake 文件。\n'+(document.querySelector('#target').value==='android'?'Android 源码模式：在 NDK 模块链接插件并配置宿主权限。':document.querySelector('#target').value.startsWith('macos')?'macOS arm64：使用匹配配置构建应用，动态配置随应用分发 dylib。':'按匹配的 SDK 与工具链构建应用。');button.textContent='重新安装';document.querySelector('#result-actions').hidden=false;},500);};
document.querySelector('#restore').onclick=()=>{document.querySelector('#terminal').textContent=installed?'离线恢复成功：使用锁定版本与已校验缓存，无网络请求。':'当前项目没有此依赖，请先安装。'};
document.querySelector('#remove').onclick=()=>{installed=false;document.querySelector('#terminal').textContent='依赖已移除，项目锁已更新。其他项目共享的缓存保留。'};
document.querySelector('#read-guide').onclick=()=>dialog.close();document.querySelector('#theme').onclick=()=>document.documentElement.classList.toggle('dark');
const guides={guide:['安装与依赖','在目录选择包与目标，锁定应用依赖。','oneui.plugins.json 声明直接依赖，oneui.lock.json 保存完整闭包。安装不编译框架。','先结束服务调用并释放租约，再停止运行时。异步资源未关闭时等待实际系统回执并重试。'],components:['组件开发','独立的 Widget，通过版本化契约在页面中使用。','使用 Namespace_Component 命名，声明属性、事件和版本。编译器与运行时读取同一份 .onecomponents 文件。','关闭时断开回调再释放 ViewModel；保留的原生控件不会继续调用已关闭页面。'],platforms:['平台装配','选择包实际提供的目标产物与工具链。','桌面链接库并随应用分发运行时；Android、iOS 与鸿蒙通过各自原生宿主接入。','权限、应用签名与系统扩展由应用宿主配置，包描述不代替系统授权。']};
function route(){const page=location.hash.slice(1)||'developers';document.querySelectorAll('nav a').forEach(a=>a.setAttribute('aria-current',a.hash==='#'+page?'page':'false'));if(page==='developers')developer();else if(page==='plugins')catalog();else if(guides[page]){const g=guides[page];main.innerHTML='<div class="body"><h1>'+g[0]+'</h1><p>'+g[1]+'</p><h2>接入方式</h2><p>'+g[2]+'</p><h2>生命周期与兼容</h2><p>'+g[3]+'</p><div class="links"><a href="#plugins">返回插件目录</a><a href="#developers">返回开发者中心</a></div></div>'}else{main.innerHTML='<h1>页面不存在</h1><a href="#developers">返回开发者中心</a>'}}
addEventListener('hashchange',route);route();
</script></body></html>
