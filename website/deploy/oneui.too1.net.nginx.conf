# Prepare a valid certificate before enabling this configuration.
server {
    listen 80;
    server_name oneui.too1.net;
    return 301 https://oneui.too1.net$request_uri;
}

server {
    listen 443 ssl;
    server_name oneui.too1.net;
    ssl_certificate /etc/letsencrypt/live/oneui.too1.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oneui.too1.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:23187;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }
}
